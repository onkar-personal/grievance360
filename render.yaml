# Render Blueprint for the Grievance360 backend (frontend is hosted on Vercel, database on Neon).
# Values marked `sync: false` are entered in the Render dashboard when the blueprint is created;
# they are never stored in this repository.
services:
  - type: web
    name: grievance360-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon: jdbc:postgresql://<host>/<database>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      # Exact Vercel origin(s), comma separated, e.g. https://grievance360.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Free instances have no persistent disk: uploads are lost on redeploy/restart.
      - key: STORAGE_DIR
        value: /tmp/attachments
      - key: SWAGGER_ENABLED
        value: "false"
      # First administrator; remove both after the first successful start.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

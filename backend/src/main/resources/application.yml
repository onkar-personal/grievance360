spring:
  application:
    name: grievance360
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grievance360}
    username: ${DB_USERNAME:grievance360}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: grievance360
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    dir: ${STORAGE_DIR:./storage}
    max-file-bytes: 5242880
    max-files-per-complaint: 5
    allowed-types: image/jpeg,image/png,image/webp,application/pdf
  auth:
    login-attempts-per-window: 10
    window-seconds: 300
  workflow:
    reopen-window-days: 14
    auto-close-days: 7
    escalation-cron: "0 */15 * * * *"
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    admin-name: ${ADMIN_BOOTSTRAP_NAME:System Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
